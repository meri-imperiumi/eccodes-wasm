name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.49.0)'
        required: true
        type: string

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false  # never use caching in release builds

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.23'

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.x'

      - name: Setup ecCodes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            # Strip package version suffix (e.g., v1.0.0 -> 2.48.1 for eccodes)
            if ! git ls-remote --tags https://github.com/ecmwf/eccodes.git | grep -q "refs/tags/${VERSION}"; then
              VERSION=2.48.1
            fi
          fi
          if [ ! -d eccodes/CMakeLists.txt ]; then
            git clone --depth 1 --branch ${VERSION} https://github.com/ecmwf/eccodes.git eccodes
          fi
          echo "ecCodes version: $(cat eccodes/VERSION)"

      - name: Build Release
        run: make release

      - name: Run Tests
        run: make test

      - name: Pre-publish Check
        run: node scripts/prepublish-check.js

      - name: Sync Version
        run: node scripts/version.js

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false  # never use caching in release builds

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.23'

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.x'

      - name: Setup ecCodes
        run: |
          if [ ! -d eccodes/CMakeLists.txt ]; then
            git clone --depth 1 --branch 2.48.1 https://github.com/ecmwf/eccodes.git eccodes
          fi

      - name: Build Release
        run: make release

      - name: Publish to NPM
        run: |
          echo "Publishing @meri-imperiumi/eccodes-wasm@$(node -p "require('./package.json').version")"
          npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/eccodes/eccodes.js
            build/eccodes/eccodes.wasm
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}