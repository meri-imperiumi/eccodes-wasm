name: Publish Node.js Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'NPM package version to publish (e.g., 2.48.2); ecCodes version is pinned in the ECCODES_VERSION file'
        required: true
        type: string

permissions:
  id-token: write  # Required for npm trusted publishing (OIDC)
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false  # never use caching in release builds

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.8'

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.x'

      - name: Resolve versions
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          ECCODES_VERSION="$(cat ECCODES_VERSION)"
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "eccodes_version=$ECCODES_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm version: $VERSION (ecCodes: $ECCODES_VERSION)"

      - name: Setup ecCodes
        run: |
          if [ ! -d eccodes/CMakeLists.txt ]; then
            git clone --depth 1 --branch ${{ steps.version.outputs.eccodes_version }} https://github.com/ecmwf/eccodes.git eccodes
          fi
          echo "ecCodes version: $(cat eccodes/VERSION)"

      - name: Build Release
        run: make release

      - name: Test
        run: make test

      - name: Pre-publish Check
        run: node scripts/prepublish-check.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: build/eccodes/
          retention-days: 1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false  # never use caching in release builds

      - name: Resolve npm version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/eccodes

      - name: Sync package version
        run: npm version ${{ steps.version.outputs.npm_version }} --no-git-tag-version --allow-same-version

      - name: Publish to NPM
        run: npm publish --access public
